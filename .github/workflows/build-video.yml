
name: Build Outlook Classic Training Video

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install video and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Build five-minute MP4
        run: python build.py

      - name: Verify MP4 output
        run: |
          test -s output/Outlook_Classic_Training.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/Outlook_Classic_Training.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Outlook-Classic-Training-MP4
          path: output/Outlook_Classic_Training.mp4
          if-no-files-found: error
          retention-days: 30
          
